[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data2dsl"
version = "0.1.0"
description = "Evidence-first deterministic data comparison and observation normalization layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "autogrammar" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
data2dsl = "data2dsl_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "data2dsl_adapters",
    "data2dsl_batch",
    "data2dsl_comparator",
    "data2dsl_consumer",
    "data2dsl_discovery",
    "data2dsl_doctor",
    "data2dsl_generator",
    "data2dsl_remediation",
    "data2dsl_skill",
    "data2dsl_subactor",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]
